services:
  sakudata:
    build: .
    container_name: sakudata
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - sakudata-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  sakudata-data:
